<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Aida Farahani for AI engineering, industrial AI, computer vision, and applied machine learning opportunities.">
    <meta name="keywords" content="AI Solutions Engineer, Industrial AI, Computer Vision, Data-Centric AI, MLOps, RAG, Scientific Machine Learning">
    <meta name="author" content="Aida Farahani">

    <title>Contact | Aida Farahani, PhD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #0f766e;
            --accent-dark: #115e59;
            --blue: #2563eb;
            --ink: #1f2937;
            --muted: #5f6b7a;
            --line: #e5e7eb;
            --surface: #f7faf9;
            --white: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--white);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }

        nav {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            gap: 1.4rem;
            justify-content: center;
            list-style: none;
            padding: 1rem 1.5rem;
        }

        nav a {
            color: var(--ink);
            font-size: 0.95rem;
            font-weight: 600;
            position: relative;
        }

        nav a::after {
            background: var(--accent);
            bottom: -6px;
            content: "";
            height: 2px;
            left: 0;
            position: absolute;
            transition: width 0.2s ease;
            width: 0;
        }

        nav a:hover {
            text-decoration: none;
        }

        nav a:hover::after {
            width: 100%;
        }

        header {
            background: linear-gradient(135deg, #f4fbf9 0%, #ffffff 70%);
            padding: 4.5rem 1.5rem 4rem;
            text-align: center;
        }

        .profile-img {
            border: 4px solid var(--white);
            border-radius: 50%;
            box-shadow: 0 18px 42px rgba(15, 118, 110, 0.16);
            display: block;
            height: 148px;
            margin: 0 auto 1.5rem;
            object-fit: cover;
            width: 148px;
        }

        h1 {
            font-size: clamp(2.1rem, 5vw, 3.4rem);
            letter-spacing: 0;
            line-height: 1.1;
            margin-bottom: 0.75rem;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .tagline {
            color: var(--muted);
            font-size: 1.15rem;
            margin: 0 auto 1.5rem;
            max-width: 760px;
        }

        .social-links,
        .cta-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .social-links {
            margin-bottom: 1.6rem;
        }

        .social-links a {
            align-items: center;
            display: inline-flex;
            font-weight: 600;
            gap: 0.45rem;
        }

        .social-link-icon {
            fill: currentColor;
            flex-shrink: 0;
            height: 1.1rem;
            width: 1.1rem;
        }

        .btn {
            border-radius: 6px;
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 0.78rem 1.2rem;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            color: var(--white);
            text-decoration: none;
            transform: translateY(-1px);
        }

        .btn-secondary {
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn-secondary:hover {
            background: var(--surface);
            text-decoration: none;
        }

        main {
            margin: 0 auto;
            max-width: 1080px;
            padding: 0 1.5rem;
        }

        section {
            border-bottom: 1px solid var(--line);
            padding: 3.4rem 0;
            scroll-margin-top: 68px;
        }

        section:last-child {
            border-bottom: none;
        }

        h2 {
            font-size: 1.85rem;
            line-height: 1.2;
            margin-bottom: 2rem;
            padding-bottom: 0.85rem;
            position: relative;
        }

        h2::before {
            background: var(--accent);
            bottom: 0;
            content: "";
            height: 3px;
            left: 0;
            position: absolute;
            width: 44px;
        }

        h3 {
            font-size: 1.15rem;
            line-height: 1.35;
            margin-bottom: 0.55rem;
        }

        p {
            color: var(--muted);
            margin-bottom: 1rem;
        }

        .about-grid {
            display: grid;
            gap: 2rem;
            grid-template-columns: 1.4fr 1fr;
        }

        .about-text p {
            line-height: 1.85;
        }

        .highlight-list {
            display: grid;
            gap: 1rem;
        }

        .highlight {
            background: var(--surface);
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 1rem;
        }

        .highlight strong {
            color: var(--ink);
            display: block;
            margin-bottom: 0.25rem;
        }

        .expertise-grid,
        .contact-grid {
            display: grid;
            gap: 1rem;
        }

        .expertise-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .skills-showcase {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .skill-item {
            align-items: flex-start;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            display: flex;
            gap: 1rem;
            padding: 1.25rem;
        }

        .skills-showcase .skill-item:last-child:nth-child(odd) {
            grid-column: 1 / -1;
        }

        .skill-item-image {
            flex-shrink: 0;
        }

        .skill-item-image img {
            border-radius: 8px;
            display: block;
            height: 72px;
            object-fit: contain;
            width: 72px;
        }

        .skill-item-info p {
            line-height: 1.7;
            margin-bottom: 0.5rem;
        }

        .skill-item-info h6 {
            color: var(--ink);
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: 0.8rem;
        }

        .skill-tags span {
            background: var(--white);
            border: 1px solid rgba(15, 118, 110, 0.24);
            border-radius: 999px;
            color: var(--accent-dark);
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1;
            padding: 0.38rem 0.62rem;
        }

        .card,
        .case-study,
        .contact-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .card p,
        .case-study p,
        .contact-item p {
            margin-bottom: 0;
        }

        .expertise-card-header {
            align-items: center;
            display: flex;
            gap: 0.85rem;
            margin-bottom: 0.8rem;
        }

        .expertise-card-header h3 {
            margin-bottom: 0;
        }

        .expertise-icon {
            align-items: center;
            background: var(--white);
            border: 1px solid rgba(15, 118, 110, 0.16);
            border-radius: 12px;
            display: inline-flex;
            flex-shrink: 0;
            height: 2.9rem;
            justify-content: center;
            width: 2.9rem;
        }

        .expertise-icon svg {
            display: block;
            fill: var(--accent);
            height: 1.35rem;
            width: 1.35rem;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.9rem;
        }

        .tech-tag {
            background: var(--white);
            border: 1px solid rgba(15, 118, 110, 0.28);
            border-radius: 999px;
            color: var(--accent-dark);
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.32rem 0.68rem;
        }

        .project-list,
        .experience-list {
            display: grid;
            gap: 1.2rem;
        }

        .project-header,
        .experience-header {
            align-items: flex-start;
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            margin-bottom: 0.65rem;
        }

        .project-date,
        .experience-date {
            color: var(--muted);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .project-impact {
            background: var(--white);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            color: var(--muted);
            margin: 1rem 0;
            padding: 0.8rem 1rem;
        }

        .project-impact strong {
            color: var(--accent-dark);
        }

        .detail-list {
            color: var(--muted);
            margin: 0.85rem 0 0;
            padding-left: 1.25rem;
        }

        .detail-list li {
            margin-bottom: 0.45rem;
        }

        .subproject {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-top: 1rem;
            padding: 1rem;
        }

        .subproject h4 {
            color: var(--accent-dark);
            font-size: 1rem;
            line-height: 1.35;
            margin-bottom: 0.35rem;
        }

        .subproject-showcase {
            align-items: start;
            display: grid;
            gap: 1rem;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 50%);
        }

        .project-video {
            background: #111827;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin: 0;
            overflow: hidden;
        }

        .project-video video {
            background: #111827;
            display: block;
            height: auto;
            margin: -1mm;
            max-width: none;
            width: calc(100% + 2mm);
        }

        .project-video figcaption {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
            padding: 0.85rem 1rem;
        }

        .education-grid {
            display: grid;
            gap: 1rem;
        }

        .education-item {
            border-bottom: 1px solid var(--line);
            padding-bottom: 1rem;
        }

        .education-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .contact-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .contact-item a {
            word-break: break-word;
        }

        footer {
            background: var(--surface);
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 2rem;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        @media (max-width: 960px) {
            .about-grid,
            .expertise-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 620px) {
            header {
                padding: 3rem 1rem;
            }

            main {
                padding: 0 1rem;
            }

            nav ul {
                gap: 0.8rem;
                padding: 0.9rem;
            }

            section {
                padding: 2.4rem 0;
            }

            .skills-showcase {
                grid-template-columns: 1fr;
            }

            .project-header,
            .experience-header {
                display: block;
            }

            .subproject-showcase {
                grid-template-columns: 1fr;
            }
        }


        .page-hero {
            background: linear-gradient(135deg, #f4fbf9 0%, #ffffff 72%);
            padding: 3.6rem 1.5rem 3rem;
            text-align: center;
        }

        .page-hero h1 {
            margin-bottom: 1rem;
        }

        .page-hero .tagline {
            margin-bottom: 0;
        }

        .cv-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.4rem;
        }

        .project-media {
            background: #eef4f3;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .project-media img,
        .project-media video {
            display: block;
            height: auto;
            width: 100%;
        }

        .project-media figcaption {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
            padding: 0.85rem 1rem;
        }

        .project-grid {
            display: grid;
            gap: 1.2rem;
        }

    </style>
</head>
